services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scrapoo
      POSTGRES_USER: scrapoo
      POSTGRES_PASSWORD: scrapoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapoo -d scrapoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn scrapoo.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A scrapoo worker -Q crawls -l INFO --concurrency=2
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A scrapoo beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
